<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#2A2A2A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="85" fill="url(#bgGrad)"/>

  <!-- CoI game icon -->
  <image href="data:image/png;base64," x="76" y="66" width="360" height="360"/>

  <!-- Badge circle (bottom right) -->
  <g transform="translate(400, 400)">
    <circle cx="0" cy="0" r="82" fill="#1A1A1A" stroke="#999" stroke-width="5" filter="url(#glow)"/>

    <!-- Combination Wrench -->
    <g fill="#C0C0C0" stroke="#888" stroke-width="1.2" transform="translate(-2, -5)">
      <!-- Handle -->
      <path d="M-16 30 L-16 -8 Q-16 -20 -6 -20 L6 -20 Q16 -20 16 -8 L16 30 Z"/>
      <path d="M-16 50 L-16 100 Q-16 112 -6 112 L6 112 Q16 112 16 100 L16 50 Z"/>

      <!-- Open-end head (top) -->
      <path d="M-16 -8 L-16 -40 Q-16 -56 0 -56 L0 -56 Q16 -56 16 -40 L16 -8
               L6 -8 L6 -35 Q6 -44 0 -44 L0 -44 Q-6 -44 -6 -35 L-6 -8 Z"/>

      <!-- Box-end head (bottom) -->
      <path d="M-30 100 Q-30 70 -6 70 L6 70 Q30 70 30 100
               L30 140 Q30 160 6 160 L-6 160 Q-30 160 -30 140 Z"/>

      <!-- Hexagonal hole -->
      <polygon points="0,115 9,121 9,135 0,141 -9,135 -9,121" fill="#1A1A1A" stroke="#999" stroke-width="0.8"/>
    </g>
  </g>
</svg>
