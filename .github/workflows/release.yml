name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CoI Mod Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🎮 CoI Mod Manager ${{ github.ref_name }}

            ### ✨ Novidades
            - Perfis de mods: crie, alterne, exporte e importe perfis isolados
            - Pool de mods: mods compartilhados entre perfis sem re-download
            - Nova tela de seleção de perfil ao iniciar
            - Suporte a capturas de tela no README
            - Diversas correções de memória e estabilidade

            ### 🔧 Instalação
            - **Windows**: baixe o `.msi` ou `.exe` (NSIS)
            - **Linux**: baixe o `.AppImage` ou `.deb`

            > Veja os commits para detalhes completos das mudanças.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
